# Build limits; Java 21 is required.
org.gradle.jvmargs=-Xmx2G -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=false

# Minecraft / NeoForge
minecraft_version=1.21.1
minecraft_version_range=[1.21.1,1.21.2)
neo_version=21.1.219
neo_version_range=[21.1.219,21.2)
loader_version_range=[4,)

# Mod identity. New-Addon.ps1 also updates the Java package and MOD_ID.
mod_id=tensura_addon
mod_name=Tensura Addon
mod_version=0.1.0
mod_group_id=com.example.tensuraaddon
mod_authors=YourName
mod_license=All Rights Reserved
mod_description=

# Bundled development dependencies. Update the matching JARs when changing versions.
tensura_version=2.0.0.1
tensura_version_range=[2.0.0.1,3)
manascore_version=4.0.0.0
manascore_version_range=[4.0.0.0,5)
architectury_version=13.0.8
geckolib_version=4.7.6
smartbrainlib_version=1.16.11
terrablender_version=4.1.0.8
